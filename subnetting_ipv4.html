<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IPv4 Subnet Calculator - A Cisso Lima App</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative min-h-screen bg-white px-6 pt-6 pb-24 text-sm text-black">

  <a
    href="index.html"
    aria-label="Back to home"
    class="absolute right-4 top-4 border border-gray-700 bg-gray-100
    px-3 py-2 text-lg leading-none shadow transition
    hover:bg-gray-200 focus:outline-none
    focus:ring-2 focus:ring-blue-500">

    <span aria-hidden="true">←</span>
    <span class="sr-only">Back</span>
  </a>

  <main class="mx-auto flex min-h-[calc(100vh-6rem)] max-w-2xl flex-col">

    <h1 class="mb-8 text-center text-xl font-bold">
      IPv4 Subnetting Calculator
    </h1>

    <h3 class="mb-4 text-lg font-semibold">
      Enter IPv4, CIDR, and Number of Subnets:
    </h3>

    <hr class="mb-4 border-gray-500">

    <!-- IPv4 and CIDR -->
    <div class="mb-4 grid grid-cols-[90px_repeat(4,1fr)_20px_60px]
      items-center gap-2">

      <label for="ip1" class="font-medium">
        IPv4:
      </label>

      <input
        id="ip1"
        class="octet min-w-0 border border-black p-1 text-center"
        type="number"
        min="0"
        max="255"
        value="192">

      <input
        class="octet min-w-0 border border-black p-1 text-center"
        type="number"
        min="0"
        max="255"
        value="168">

      <input
        class="octet min-w-0 border border-black p-1 text-center"
        type="number"
        min="0"
        max="255"
        value="10">

      <input
        class="octet min-w-0 border border-black p-1 text-center"
        type="number"
        min="0"
        max="255"
        value="35">

      <span class="text-center text-lg">
        /
      </span>

      <input
        id="cidr"
        class="w-full border border-black p-1 text-center"
        type="number"
        min="0"
        max="32"
        value="24">
    </div>

    <!-- Number of subnets -->
    <div class="mb-6 flex items-center gap-3">
      <label for="subnetCount" class="font-medium">
        Nr. of Subnets:
      </label>

      <input
        id="subnetCount"
        class="w-24 border border-black p-1 text-center"
        type="number"
        min="1"
        step="1"
        value="4">
    </div>

    <!-- Results -->
    <h3 class="mb-4 mt-2 text-lg font-semibold">
      Results
    </h3>

    <hr class="mb-4 border-gray-500">

    <div
      id="results"
      class="min-h-0 flex-1 overflow-y-auto whitespace-pre-wrap
      border border-gray-500 p-4 font-mono">
    </div>

  </main>

  <!-- Calculate button -->
  <button
    id="calculateButton"
    class="fixed bottom-4 left-1/2 -translate-x-1/2 border border-gray-700
    bg-gray-100 px-8 py-3 shadow transition hover:bg-gray-200
    focus:outline-none focus:ring-2 focus:ring-blue-500">

    Calculate
  </button>

  <script>
    const ipInputs = document.querySelectorAll(".octet");
    const cidrInput = document.getElementById("cidr");
    const subnetCountInput = document.getElementById("subnetCount");
    const results = document.getElementById("results");
    const calculateButton = document.getElementById("calculateButton");

    calculateButton.addEventListener("click", calculateSubnets);

    document.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        calculateSubnets();
      }
    });

    function calculateSubnets() {
      clearResults();

      const ip = [...ipInputs].map(input => Number(input.value));
      const cidrText = cidrInput.value.trim();
      const subnetCountText = subnetCountInput.value.trim();

      if (ip.some(value => !isValidOctet(value))) {
        showError("Invalid IPv4 address.");
        return;
      }

      if (cidrText === "") {
        showError("Enter a CIDR value from 0 to 32.");
        return;
      }

      if (subnetCountText === "") {
        showError("Enter the number of subnets.");
        return;
      }

      const cidr = Number(cidrText);
      const subnetCount = Number(subnetCountText);

      if (!Number.isInteger(cidr) || cidr < 0 || cidr > 32) {
        showError("Invalid CIDR. Enter a value from 0 to 32.");
        return;
      }

      if (!Number.isInteger(subnetCount) || subnetCount < 1) {
        showError("The number of subnets must be a positive whole number.");
        return;
      }

      if (!isPowerOfTwo(subnetCount)) {
        showError(
          "Invalid number of subnets. Use 1, 2, 4, 8, 16, 32, etc."
        );
        return;
      }

      const extraBits = Math.log2(subnetCount);
      const newCIDR = cidr + extraBits;

      if (newCIDR > 32) {
        showError(
          `Cannot divide /${cidr} into ${subnetCount} subnets.`
        );
        return;
      }

      const inputIP = ipToInteger(ip);
      const originalMask = cidrToMask(cidr);
      const originalNetwork = inputIP & originalMask;

      const subnetMask = cidrToMask(newCIDR);
      const addressesPerSubnet = 2 ** (32 - newCIDR);

      let output = "";

      output += `Original Network: ${integerToIP(originalNetwork)}/${cidr}\n`;
      output += `Number of Subnets: ${subnetCount}\n`;
      output += `New CIDR: /${newCIDR}\n`;
      output += `Subnet Mask: ${integerToIP(subnetMask)}\n`;
      output += `Addresses per Subnet: ${addressesPerSubnet}\n\n`;

      for (let index = 0; index < subnetCount; index++) {
        const networkID =
          originalNetwork + index * addressesPerSubnet;

        const broadcast =
          networkID + addressesPerSubnet - 1;

        const firstValid =
          addressesPerSubnet > 2
            ? networkID + 1
            : networkID;

        const lastValid =
          addressesPerSubnet > 2
            ? broadcast - 1
            : broadcast;

        const usableHosts =
          addressesPerSubnet > 2
            ? addressesPerSubnet - 2
            : addressesPerSubnet;

        output += `Subnet ${index + 1}: ${integerToIP(networkID)}/${newCIDR}\n`;
        output += `\tNetwork ID: ${integerToIP(networkID)}\n`;
        output += `\tBroadcast: ${integerToIP(broadcast)}\n`;
        output += `\tValid IPs: ${integerToIP(firstValid)} - ${integerToIP(lastValid)}\n`;
        output += `\n\tTotal / Usable Addresses: ${addressesPerSubnet} / ${usableHosts}\n\n`;
      }

      results.textContent = output.trim();
    }

    function isPowerOfTwo(value) {
      return value > 0 && (value & (value - 1)) === 0;
    }

    function isValidOctet(value) {
      return Number.isInteger(value) &&
        value >= 0 &&
        value <= 255;
    }

    function ipToInteger(ip) {
      return (
        ((ip[0] << 24) |
        (ip[1] << 16) |
        (ip[2] << 8) |
        ip[3]) >>> 0
      );
    }

    function integerToIP(value) {
      return [
        (value >>> 24) & 255,
        (value >>> 16) & 255,
        (value >>> 8) & 255,
        value & 255
      ].join(".");
    }

    function cidrToMask(cidr) {
      if (cidr === 0) {
        return 0;
      }

      return (0xffffffff << (32 - cidr)) >>> 0;
    }

    function clearResults() {
      results.classList.remove("text-red-600");
      results.textContent = "";
    }

    function showError(message) {
      results.classList.add("text-red-600");
      results.textContent = message;
    }
  </script>

</body>
</html>
