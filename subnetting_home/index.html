<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home IPv4 Subnet Calculator - A Cisso Lima App</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative min-h-screen bg-white px-6 pt-6 pb-24 text-sm text-black">

  <a
    href="../index.html"
    aria-label="Back to home"
    class="absolute right-4 top-4 border border-gray-700 bg-gray-100
    flex h-10 w-10 items-center justify-center rounded-full p-0
    text-center text-lg leading-none shadow transition
    hover:bg-gray-200 focus:outline-none
    focus:ring-2 focus:ring-blue-500">

    <img
      src="../assets/back-button.png"
      alt=""
      aria-hidden="true"
      class="h-full w-full object-contain">
  </a>

  <main class="mx-auto flex min-h-[calc(100vh-6rem)] max-w-2xl flex-col">

    <h1 class="mb-8 text-center text-xl font-bold">
      Subnetting your home with IPv4
    </h1>

    <h3 class="mb-4 text-lg font-semibold">
      Enter the IPv4 network information:
    </h3>

    <hr class="mb-4 border-gray-500">

    <div class="mb-4 grid grid-cols-[90px_repeat(4,1fr)_20px_60px]
      items-center gap-2">

      <label for="ip1" class="font-medium">
        IPv4:
      </label>

      <input
        id="ip1"
        class="octet min-w-0 border border-black p-1 text-center"
        type="number"
        min="0"
        max="255"
        value="192">

      <input
        class="octet min-w-0 border border-black p-1 text-center"
        aria-label="IPv4 second octet"
        type="number"
        min="0"
        max="255"
        value="168">

      <input
        class="octet min-w-0 border border-black p-1 text-center"
        aria-label="IPv4 third octet"
        type="number"
        min="0"
        max="255"
        value="10">

      <input
        class="octet min-w-0 border border-black p-1 text-center"
        aria-label="IPv4 fourth octet"
        type="number"
        min="0"
        max="255"
        value="1">

      <span class="text-center text-lg">
        /
      </span>

      <input
        id="cidr"
        class="w-full border border-black p-1 text-center"
        aria-label="CIDR prefix"
        type="number"
        min="0"
        max="32"
        value="24">
    </div>

    <div class="mb-6 grid grid-cols-[120px_repeat(4,1fr)_20px_60px]
      items-center gap-2">

      <label for="mask1" class="font-medium">
        Subnet Mask:
      </label>

      <input
        id="mask1"
        class="mask-octet min-w-0 border border-black p-1 text-center"
        aria-label="Subnet mask first octet"
        type="number"
        min="0"
        max="255"
        value="255">

      <input
        class="mask-octet min-w-0 border border-black p-1 text-center"
        aria-label="Subnet mask second octet"
        type="number"
        min="0"
        max="255"
        value="255">

      <input
        class="mask-octet min-w-0 border border-black p-1 text-center"
        aria-label="Subnet mask third octet"
        type="number"
        min="0"
        max="255"
        value="255">

      <input
        class="mask-octet min-w-0 border border-black p-1 text-center"
        aria-label="Subnet mask fourth octet"
        type="number"
        min="0"
        max="255"
        value="0">

      <span></span>
      <span></span>
    </div>

    <h3 class="mb-4 text-lg font-semibold">
      How many devices do you have at home ?
    </h3>

    <hr class="mb-4 border-gray-500">

    <div class="mb-6 flex items-center gap-3">
      <label for="deviceCount" class="font-medium">
        Enter the number of devices:
      </label>

      <input
        id="deviceCount"
        class="w-24 border border-black p-1 text-center"
        type="number"
        min="1"
        step="1"
        value="10">
    </div>

    <h3 class="mb-4 mt-2 text-lg font-semibold">
      Results
    </h3>

    <hr class="mb-4 border-gray-500">

    <div
      id="results"
      class="min-h-0 flex-1 overflow-y-auto whitespace-pre-wrap
      border border-gray-500 p-4 font-mono">
    </div>

  </main>

  <button
    id="calculateButton"
    class="fixed bottom-4 left-1/2 -translate-x-1/2 border border-gray-700
    bg-gray-100 px-8 py-3 shadow transition hover:bg-gray-200
    focus:outline-none focus:ring-2 focus:ring-blue-500">

    Calculate
  </button>

  <script src="script.js"></script>

</body>
</html>
