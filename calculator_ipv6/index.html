<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPv6 Subnet Calculator - A Cisso Lima App</title>

    <script>
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/theme.css">
</head>

<body class="relative min-h-screen bg-white px-6 pt-20 pb-24 text-sm text-black">

    <div class="page-controls">
        <button id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
            <span id="themeIcon" aria-hidden="true">☾</span>
        </button>
        <a href="../index.html" aria-label="Back to home" title="Back to home">
            <img src="../assets/back-button.png" alt="" aria-hidden="true">
        </a>
    </div>


    <main class="mx-auto flex min-h-[calc(100vh-6rem)] max-w-2xl flex-col">

        <h1 class="mb-8 text-center text-xl font-bold">
            IPv6 Subnetting Calculator
        </h1>

        <h3 class="mb-4 text-lg font-semibold">
            Enter IPv6 Address and CIDR Prefix:
        </h3>

        <hr class="mb-4 border-gray-500">

            <div class="mb-6">
            <label class="mb-2 block font-medium">
                IPv6:
            </label>

            <div class="grid grid-cols-4 gap-2">
                <input id="ipv6-1"
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="2001">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0db8">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0">

                <input
                class="ipv6-group min-w-0 border border-black p-1 text-center uppercase"
                type="text" maxlength="4" value="0001">
            </div>

            <div class="mt-3 flex items-center gap-2">
                <label for="cidr" class="font-medium">CIDR:</label>

                <span class="text-lg">/</span>

                <input
                id="cidr"
                class="w-20 border border-black p-1 text-center"
                type="number"
                min="0"
                max="128"
                value="64">
            </div>
            </div>



        <h3 class="mb-4 mt-6 text-lg font-semibold">
            Results
        </h3>

        <hr class="mb-4 border-gray-500">

        <div
            id="results"
            class="min-h-0 flex-1 overflow-y-auto whitespace-pre-wrap border border-gray-500 p-4 font-mono">
        </div>

        <footer class="mt-auto pt-12 text-left text-sm text-gray-600 dark:text-gray-400">
            <p>Created by <a href="https://github.com/mike-lima-uno" class="hover:text-black dark:hover:text-white">Cicero Lima</a></p>
            <p class="mt-1">under the <a href="../LICENSE" class="underline hover:text-black dark:hover:text-white">MIT License</a></p>
        </footer>

    </main>

    <button
        id="calculateButton"
        class="fixed bottom-4 left-1/2 -translate-x-1/2 border border-gray-700
        bg-gray-100 px-8 py-3 shadow hover:bg-gray-200 focus:outline-none
        focus:ring-2 focus:ring-blue-500">
        Calculate
    </button>

    <script src="script.js"></script>
    <script src="../assets/theme-toggle.js"></script>

</body>
</html>
